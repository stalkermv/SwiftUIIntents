name: Tests

on:
  push:
    branches: [ main, "2.0" ]
  pull_request:
    branches: [ main, "2.0" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-test:
    name: Swift Test
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      - name: Show Swift version
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build package
        run: swift build

      - name: Build with complete strict concurrency checking
        run: swift build -Xswiftc -strict-concurrency=complete

      - name: Run tests
        run: swift test --parallel

  documentation:
    name: DocC Build Check
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      - name: Build documentation
        run: |
          DOCS_DIR="$(mktemp -d)"
          swift package --allow-writing-to-directory "$DOCS_DIR" \
            generate-documentation --target SwiftUIIntents \
            --output-path "$DOCS_DIR" \
            --transform-for-static-hosting \
            --hosting-base-path SwiftUIIntents

  apple-platforms:
    name: Compile for ${{ matrix.destination }}
    runs-on: xcode-27

    strategy:
      fail-fast: false
      matrix:
        destination:
          - generic/platform=iOS
          - generic/platform=macOS
          - generic/platform=tvOS
          - generic/platform=watchOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build for ${{ matrix.destination }}
        env:
          DESTINATION: ${{ matrix.destination }}
        run: |
          log="${RUNNER_TEMP:-/tmp}/build.log"
          build() {
            xcodebuild build \
              -scheme SwiftUIIntents \
              -destination "$DESTINATION" \
              -derivedDataPath "${RUNNER_TEMP:-/tmp}/SwiftUIIntents-derived" \
              CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$log"
            return "${PIPESTATUS[0]}"
          }
          if ! build; then
            # Some runners come without the device platform that Xcode needs for a
            # generic destination. Install it and retry; fail on any other error.
            platform="${DESTINATION#generic/platform=}"
            if grep -q "is not installed" "$log"; then
              xcodebuild -downloadPlatform "$platform"
              build
            else
              exit 1
            fi
          fi

  test-ios:
    name: Test on an iOS Simulator
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      - name: Run tests on an iOS Simulator
        run: |
          log="${RUNNER_TEMP:-/tmp}/test-ios.log"
          # Newest available iPhone simulator; its name changes between runner images.
          simulator() {
            xcrun simctl list devices available iPhone | grep -Eo '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}' | tail -1
          }
          run_tests() {
            udid="$(simulator)"
            if [ -z "$udid" ]; then
              echo "No iOS simulator available" | tee "$log"
              return 1
            fi
            xcodebuild test -scheme SwiftUIIntents -destination "platform=iOS Simulator,id=$udid" \
              -derivedDataPath "${RUNNER_TEMP:-/tmp}/SwiftUIIntents-test" \
              CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$log"
            return "${PIPESTATUS[0]}"
          }
          if ! run_tests; then
            # Some runners come without the iOS platform. Install it and retry;
            # fail on any other error.
            if grep -qE "is not installed|No iOS simulator available" "$log"; then
              xcodebuild -downloadPlatform iOS
              run_tests
            else
              exit 1
            fi
          fi
