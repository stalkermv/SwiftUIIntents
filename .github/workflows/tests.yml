name: Tests

on:
  push:
    branches: [ main, "2.0" ]
  pull_request:
    branches: [ main, "2.0" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-test:
    name: Swift Test
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      - name: Show Swift version
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build package
        run: swift build

      - name: Run tests
        run: swift test --parallel

  documentation:
    name: DocC Build Check
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      - name: Build documentation
        run: |
          DOCS_DIR="$(mktemp -d)"
          swift package --allow-writing-to-directory "$DOCS_DIR" \
            generate-documentation --target SwiftUIIntents \
            --output-path "$DOCS_DIR" \
            --transform-for-static-hosting \
            --hosting-base-path SwiftUIIntents

  apple-platforms:
    name: Compile for ${{ matrix.destination }}
    runs-on: xcode-27

    strategy:
      fail-fast: false
      matrix:
        destination:
          - "generic/platform=iOS Simulator"
          - "platform=macOS"
          - "generic/platform=tvOS Simulator"
          - "generic/platform=watchOS Simulator"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      - name: Build for destination
        run: |
          xcodebuild build \
            -scheme SwiftUIIntents \
            -destination "${{ matrix.destination }}" \
            -derivedDataPath "$RUNNER_TEMP/SwiftUIIntents-derived" \
            CODE_SIGNING_ALLOWED=NO
